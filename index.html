<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smarter Browser AI</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 8px; }
    .message { margin: 8px 0; padding: 6px 10px; border-radius: 6px; }
    .user { background: #e3f2fd; text-align: right; }
    .assistant { background: #f1f8e9; }
    #status { color: #555; font-size: 0.9em; margin-bottom: 10px; }
    textarea { width: 100%; height: 60px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    button { margin-top: 8px; padding: 8px 16px; cursor: pointer; border-radius: 6px; border: none; background: #0078d4; color: white; font-weight: bold; }
    button:disabled { background: #aaa; }
  </style>
</head>
<body>
  <h1>My Smarter Browser AI</h1>
  <div id="status">Loading model... (this may take a minute, ~1.7 GB download the first time)</div>
  <div id="chat"></div>
  <textarea id="input" placeholder="Type your message here..."></textarea>
  <br />
  <button id="send" disabled>Send</button>
  <button id="export">Export Chat</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
